name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TranslateOverlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: translate-overlay-debug
          path: TranslateOverlay.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest TranslateOverlay.apk \
            --title "Latest build" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Install it on your phone and allow installs from unknown sources if asked." \
            --target "$GITHUB_SHA"
